services:
  db:
    image: postgres:16-alpine
    container_name: onboarding-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboard_pw}
      POSTGRES_DB: ${POSTGRES_DB:-onboarding}
    volumes:
      - pgdata:/var/lib/postgresql/data        # data survives container restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro # schema + seed run on first start
    ports:
      - "5433:5432"                             # 5433 on the Mac so it doesn't clash with local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: onboarding-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onboard}:${POSTGRES_PASSWORD:-onboard_pw}@db:5432/${POSTGRES_DB:-onboarding}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy              # wait until Postgres actually accepts connections
    restart: unless-stopped

volumes:
  pgdata:
